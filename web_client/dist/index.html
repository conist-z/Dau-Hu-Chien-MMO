<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Map — Web Client</title>
    <script type="module" crossorigin src="./assets/index-DeDxGGLm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-02-RJ28n.css">
  </head>
  <body>
    <div id="game-root">
      <div id="overlay">
        <!-- Top-left: clock + weather (flush corner) -->
        <div id="hud-topleft" class="hud-box">
          <span id="hud-clock">--:--</span>
          <span id="hud-daynight" title="Buổi">🌅</span>
          <span id="hud-weather">☀️</span>
        </div>
        <!-- Bottom-left: live connection ping (ms) -->
        <div id="hud-bottomleft" class="hud-box">
          <span id="hud-ping" title="Độ trễ kết nối">--</span>
        </div>
        <!-- Top-right: HP + mana bars (flush corner) -->
        <div id="hud-topright" class="hud-box">
          <div class="bar" id="bar-hp">
            <div class="bar-fill" id="bar-hp-fill"></div>
            <span class="bar-label" id="bar-hp-label">100/100</span>
          </div>
          <div class="bar" id="bar-mana">
            <div class="bar-fill mana" id="bar-mana-fill"></div>
            <span class="bar-label" id="bar-mana-label">50/50</span>
          </div>
        </div>
        <!-- Bottom-center: hotbar (always visible) -->
        <div id="hud-hotbar"></div>
        <!-- Bottom-right: chat box + commands -->
        <div id="hud-chat">
          <div id="chat-log"></div>
          <form id="chat-form">
            <input id="chat-input" type="text" placeholder="Nhập /lệnh..." autocomplete="off" />
          </form>
        </div>
        <!-- Center: toast area -->
        <div id="hud-toast"></div>
        <!-- Death overlay (hp 0): full-screen veil + respawn countdown -->
        <div id="death-overlay" class="hidden">
          <div class="death-panel">
            <h2>Bạn đã gục</h2>
            <p id="death-reason">Bị zombie tấn công</p>
            <p id="death-timer">Hồi sinh sau 5s…</p>
          </div>
        </div>
        <!-- Inventory + Craft panels (pixel asset panels, handoff geometry) -->
        <div id="inv-panel" class="hidden">
          <!-- Tab strip mirrors the pixel look but stays plain DOM (no panel art). -->
          <div class="inv-tabs">
            <button class="inv-tab active" data-tab="items" type="button">Túi đồ</button>
            <button class="inv-tab" data-tab="craft" type="button">Chế tạo</button>
            <button class="inv-close" id="inv-close" type="button">✕</button>
          </div>
          <!-- INVENTORY (V5 frame_01): 98×101 frame, 20 slots 5×4 at
               (10,17) pitch 16, currency overlays at kit bboxes -->
          <div id="inv-items-wrap" class="panel-wrap">
            <img class="panel" src="ui/v5/layers/inv_frame.png" alt="" draggable="false">
          </div>
          <!-- CRAFT (V5 frame3_03): 198×117 frame — quick-craft 3×5 @(10,33),
               materials 3×3 @(74,17), result [108,90,16,16], create [76,69].
               The INVENTORY panel below is the drag partner for materials. -->
          <div id="inv-craft-wrap" class="panel-wrap hidden">
            <img class="panel" src="ui/v5/layers/craft_frame.png" alt="" draggable="false">
          </div>
          <!-- Inventory panel is ALSO visible on the craft tab (drag source) -->
          <div id="inv-items-craft" class="panel-wrap hidden">
            <img class="panel" src="ui/v5/layers/inv_frame.png" alt="" draggable="false">
          </div>
          <!-- Selected recipe detail (inputs → output, needs-table hint) -->
          <div id="craft-detail" class="hidden"></div>
        </div>
        <!-- Loading overlay: shown ONLY when the world genuinely needs to
             fetch assets (fresh session). When everything is already cached
             (re-join in the same session) it never appears. -->
        <div id="loading-overlay" class="hidden">
          <div class="loading-panel">
            <h2>Đang tải map…</h2>
            <div class="loading-bar"><div id="loading-fill"></div></div>
            <p id="loading-status">0 / 0</p>
          </div>
        </div>
        <!-- Login / join gate -->
        <div id="login-gate">
          <div class="panel">
            <h1>Map Game</h1>
            <p id="login-status">Đăng nhập bằng Discord…</p>
            <button id="btn-login" type="button">Đăng nhập bằng Discord</button>
            <div id="scenario-list"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
